[workspace]
resolver = "2"
members = ["crates/core", "crates/sync", "crates/ui", "crates/android", "apps/linux"]
default-members = ["crates/core", "crates/sync", "crates/ui", "apps/linux"]

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/MDHaarith/Patch"

[workspace.dependencies]
patch-core = { path = "crates/core" }
patch-sync = { path = "crates/sync" }
patch-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
slint = { version = "1.18", default-features = false }
slint-build = "1.18"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
