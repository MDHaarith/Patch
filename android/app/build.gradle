plugins {
    id "com.android.application"
}

// Release signing: create android/keystore.properties (gitignored) with
//
//     storeFile=/absolute/path/to/patch-release.jks
//     storePassword=...
//     keyAlias=patch
//     keyPassword=...
//
// (keytool -genkeypair -v -keystore patch-release.jks -keyalg RSA -keysize 4096
//  -validity 10000 -alias patch). Without it, release builds are signed with
// the debug key so they still install.
def keystoreFile = rootProject.file("keystore.properties")
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

// The workspace Cargo.toml is the single source of the version; tags are v<version>.
def cargoVersion = (rootProject.file("../Cargo.toml").text =~ /(?m)^version = "(\d+)\.(\d+)\.(\d+)"/)[0]

android {
    namespace "com.mdhaarith.patch"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.mdhaarith.patch"
        minSdk 26
        targetSdk 35
        versionCode cargoVersion[1].toInteger() * 10000 + cargoVersion[2].toInteger() * 100 + cargoVersion[3].toInteger()
        versionName "${cargoVersion[1]}.${cargoVersion[2]}.${cargoVersion[3]}"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystore["storeFile"])
                storePassword keystore["storePassword"]
                keyAlias keystore["keyAlias"]
                keyPassword keystore["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Stored uncompressed and page-aligned: mapped straight from the APK.
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// The Rust library is built by cargo-ndk before packaging. It is an optimised
// build even for debug APKs: the software renderer is far too slow unoptimised.
// PATCH_RUST_PROFILE=debug overrides that; PATCH_SKIP_RUST=1 packages whatever
// is already in src/main/jniLibs.
def cargoBuild = tasks.register("cargoBuild", Exec) {
    group = "build"
    description = "Builds libpatch_android.so with cargo-ndk"
    workingDir rootProject.projectDir
    commandLine "bash", "${rootProject.projectDir}/build-rust.sh", System.getenv("PATCH_RUST_PROFILE") ?: "release"
    environment "ANDROID_HOME", android.sdkDirectory.absolutePath
    onlyIf { System.getenv("PATCH_SKIP_RUST") != "1" }
}

tasks.configureEach { task ->
    if (task.name ==~ /merge.*JniLibFolders/) {
        task.dependsOn cargoBuild
    }
}
