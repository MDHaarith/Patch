name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

# One check per PR commit; preserve in-flight main/tag publication jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Every main push releases v<Cargo.toml version>, so each change to main
      # must bump it (0.1.1 -> 0.1.2) or the app's updater would never see it.
      - name: Version is new
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
          elif [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_BASE_REF" == main ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
              echo "::error::v$v is already released; bump version in Cargo.toml"
              exit 1
            else
              status=$?
              [ "$status" -eq 2 ] || exit "$status"
            fi
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        timeout-minutes: 5
        run: bash .github/scripts/install-system-deps.sh pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libxkbcommon-x11-0 libegl1
      - run: cargo clippy -p patch-core -p patch-sync -p patch-ui --all-targets -- -D warnings
      - run: cargo test -p patch-core -p patch-sync -p patch-ui
      - run: bash .github/scripts/test-release-body.sh
      - name: Render screenshots
        run: cargo run -p patch-ui --example shots -- screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        timeout-minutes: 5
        run: bash .github/scripts/install-system-deps.sh pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libxkbcommon-x11-0 libegl1
      - run: cargo build --release -p patch-linux -p patch-sync --bins
      - name: Bundle
        run: |
          mkdir -p dist/patch
          cp target/release/patch target/release/patch-hub dist/patch/
          cp -r packaging scripts README.md LICENSE dist/patch/
          tar -C dist -czf patch-linux-x86_64.tar.gz patch
      - uses: actions/upload-artifact@v4
        with:
          name: patch-linux-x86_64
          path: patch-linux-x86_64.tar.gz

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # The runner ships the Android SDK; use its sdkmanager directly
      # (setup-android tries to install the long-removed "tools" package).
      - name: SDK packages
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null
          # The NDK is a large download that occasionally arrives corrupted.
          for attempt in 1 2 3; do
            "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          # Host tests and NDK builds use separate Cargo target directories.
          workspaces: |
            . -> target
            . -> target-android
      - run: cargo install cargo-ndk --locked
      # The host-side tests build Slint for Linux, which links fontconfig.
      - name: System libraries
        timeout-minutes: 5
        run: bash .github/scripts/install-system-deps.sh pkg-config libfontconfig1-dev
      - name: Host tests (JNI contract, runtime)
        run: cargo test -p patch-android
      # Releases must always be signed with the same key, or Android refuses
      # to install them as updates. Add the four repository secrets once; tag
      # and main builds fail without them instead of shipping a debug key.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            echo "::error::Release builds need the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets"
            exit 1
          else
            echo "No release key configured: this build's release APK is debug-signed (fine for testing, not for publishing)."
          fi
      - name: Build APKs and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

  # Every push to main and every v* tag becomes the GitHub Release
  # v<Cargo.toml version> with the Android APK and the Linux bundle.
  release:
    if: github.event_name == 'push'
    needs: [test, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release tag
        run: echo "TAG=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: Name the files
        run: |
          mkdir dist
          cp artifacts/android-apk/release/*.apk "dist/patch-android-${TAG}.apk"
          cp artifacts/patch-linux-x86_64/*.tar.gz "dist/patch-linux-x86_64-${TAG}.tar.gz"
      - name: Release images and body
        run: |
          cp assets/images/icon.png dist/patch-icon.png
          cp artifacts/screenshots/desktop-matte-{month,week,board}.png \
            artifacts/screenshots/phone-matte-month.png \
            artifacts/screenshots/overlay-matte-{panel,bubble}.png \
            artifacts/screenshots/desk-matte.png dist/
          bash .github/scripts/release-body.sh "$TAG" > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Patch ${{ env.TAG }}
          body_path: release-body.md
          generate_release_notes: true
          files: dist/*
