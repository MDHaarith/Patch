name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libxkbcommon-x11-0 libegl1
      - run: cargo clippy -p patch-core -p patch-sync -p patch-ui --all-targets -- -D warnings
      - run: cargo test -p patch-core -p patch-sync -p patch-ui
      - name: Render screenshots
        run: cargo run -p patch-ui --example shots -- screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libxkbcommon-x11-0 libegl1
      - run: cargo build --release -p patch-linux -p patch-sync --bins
      - name: Bundle
        run: |
          mkdir -p dist/patch
          cp target/release/patch target/release/patch-hub dist/patch/
          cp -r packaging scripts README.md LICENSE dist/patch/
          tar -C dist -czf patch-linux-x86_64.tar.gz patch
      - uses: actions/upload-artifact@v4
        with:
          name: patch-linux-x86_64
          path: patch-linux-x86_64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The runner ships the Android SDK; use its sdkmanager directly
      # (setup-android tries to install the long-removed "tools" package).
      - name: SDK packages
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Host tests (JNI contract, runtime)
        run: cargo test -p patch-android
      - name: Build APKs and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            patch-linux-x86_64/*.tar.gz
            android-apk/*.apk
